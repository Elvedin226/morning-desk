name: Daily dashboard

# Rebuilds dashboard.html each weekday morning and commits it back.
#
# WHY THIS EXISTS: the Claude cloud sandbox blocks every market-data host
# (Yahoo, stooq, Alpaca, Finnhub, Tiingo, polygon — all 000), but reaches
# raw.githubusercontent.com fine. GitHub Actions runners have open network
# access, so the data work happens here and the Claude routine only has to read
# the finished file back out of this repo.
#
# 13:00 UTC = 08:00 America/Chicago = 09:00 ET, ~30 min before the US open.

on:
  schedule:
    # 13:00 UTC = 08:00 CT, half an hour before the open. Full run: resolves
    # exits, picks the day's entry, scans pre-market gaps.
    - cron: "0 13 * * 1-5"
    # Every half hour through the session (14:00-20:30 UTC = 09:00-15:30 CT).
    # These manage EXITS against the live session high/low so a stop fires on
    # the day it is hit, and take further forced entries.
    - cron: "0,30 14-20 * * 1-5"
  workflow_dispatch:      # lets you run it by hand from the Actions tab

# Runs push to the same branch, so two overlapping runs would race on the push.
# Queue them instead of cancelling: a cancelled run could drop a recorded exit.
concurrency:
  group: morning-desk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write     # required to commit the rebuilt dashboard

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install --quiet yfinance pandas numpy

      - name: Run the paper account and build the dashboard
        # The 13:00 run is the full morning build; every other schedule is an
        # intraday pass that skips the pre-market gap scan.
        run: |
          if [ "${{ github.event.schedule }}" = "0 13 * * 1-5" ] || [ -z "${{ github.event.schedule }}" ]; then
            python cloud_bot.py
          else
            python cloud_bot.py --intraday
          fi

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # portfolio.json is the paper account itself. Runners share nothing but
          # the repo, so if this is not committed the account resets to its
          # opening balance every morning and no record ever accumulates.
          git add dashboard.html data_cache/portfolio.json data_cache/gex_history.jsonl data_cache/gex_latest.json
          # No-op when the file is byte-identical, so quiet days do not create
          # empty commits.
          if git diff --staged --quiet; then
            echo "dashboard unchanged - nothing to commit"
          else
            git commit -m "dashboard: $(date -u +'%Y-%m-%d %H:%M UTC')"
            # Another run may have pushed while this one was working. Rebase
            # rather than force: losing a recorded exit would corrupt the record.
            git pull --rebase --autostash origin main || true
            git push
          fi
